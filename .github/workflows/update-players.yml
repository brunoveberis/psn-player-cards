name: Update PSN Players

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Read Exophase levels
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: npm run update

      - name: Upload debugging information
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exophase-debug
          path: |
            debug-*.txt
            debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated players.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add players.json

          if git diff --cached --quiet; then
            echo "No player changes to commit."
          else
            git commit -m "Update PSN player rankings"
            git push
          fi
