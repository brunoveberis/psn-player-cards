name: Update PSN Players

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate players and levels
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: node scripts/players.js

      - name: Refresh and verify card URLs
        run: node scripts/refresh-card-urls.js

      - name: Commit updated players.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add players.json

          if git diff --cached --quiet; then
            echo "No player changes to commit."
          else
            git commit -m "Update PSN players and card URLs"
            git push
          fi
